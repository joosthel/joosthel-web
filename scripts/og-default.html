<!doctype html>
<!-- Source for public/assets/imgs/og-default.png (1200x630). Render with any
     headless Chromium at a 1200x630 viewport, e.g. Playwright's
     page.screenshot(). Google Fonts is only used here, at render time; the
     site itself self-hosts Geist. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #EFEFEF; color: #131313; font-family: Geist, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { box-sizing: border-box; height: 100%; padding: 56px 64px 64px; display: flex; flex-direction: column; justify-content: space-between; }
  .bar { display: flex; justify-content: space-between; border-top: 1px solid #131313; padding-top: 16px; font-weight: 300; font-size: 18px; letter-spacing: 0.06em; text-transform: uppercase; }
  .muted { color: #6B6B6B; }
  h1 { margin: 0; font-weight: 500; font-size: 132px; line-height: 0.95; letter-spacing: -0.045em; }
  p { margin: 24px 0 0; font-size: 30px; line-height: 1.3; letter-spacing: -0.01em; color: #6B6B6B; }
</style>
</head>
<body>
  <div class="card">
    <div class="bar"><span>joosthelfers.com</span><span class="muted">Berlin</span></div>
    <div>
      <h1>Joost Helfers</h1>
      <p>Founder and Creative Technologist, system³</p>
    </div>
  </div>
</body>
</html>
